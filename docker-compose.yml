services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tekstil
      POSTGRES_PASSWORD: tekstil
      POSTGRES_DB: tekstil
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./tekstil_planlama_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
volumes:
  pgdata:
